# Publicação em origem dedicada (ex.: https://fiscaliza.<domínio>/): a aplicação ocupa a RAIZ do host.
# Usar junto com APP_BASE_PATH vazio (compose.origem-dedicada.yaml). O caminho antigo /promotheusfiscaliza continua
# funcionando aqui como redirecionamento permanente para a raiz, preservando o restante do caminho e a consulta.
# TLS fica no proxy à frente deste contêiner (Caddy, Traefik, nginx); ver docs/operacao.md, "Publicação".
ServerTokens Prod
ServerSignature Off

<VirtualHost *:80>
    DocumentRoot /app/public

    RedirectMatch 301 ^/promotheusfiscaliza/?(.*)$ /$1

    <Directory /app>
        Require all denied
    </Directory>
    <Directory /app/public>
        Options -Indexes -MultiViews
        AllowOverride None
        Require all granted
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [QSA,L]
        Header always set X-Content-Type-Options "nosniff"
        Header always set Cross-Origin-Resource-Policy "same-origin"
        <FilesMatch "\.(css|js|svg|woff2|png)$">
            Header set Cache-Control "public, max-age=604800"
            Header set Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self' data:; font-src 'self'; frame-ancestors 'none'"
        </FilesMatch>
    </Directory>

    AddOutputFilterByType DEFLATE text/html text/css application/javascript application/json image/svg+xml
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
