; Ajustes de produção também usados localmente: erros vão para log, nunca para a resposta.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/log/fiscaliza/php-error.log
expose_php = Off
date.timezone = UTC
memory_limit = 256M
max_execution_time = 30
post_max_size = 1M
upload_max_filesize = 0
file_uploads = Off
allow_url_fopen = Off

session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.save_path = /var/lib/fiscaliza/sessions
session.gc_maxlifetime = 28800
