# Simula a implantação pretendida: a raiz "/" representa o portal (fora deste projeto)
# e somente /promotheusfiscaliza chega à aplicação do desafio.
ServerTokens Prod
ServerSignature Off

<VirtualHost *:80>
    DocumentRoot /var/www/portal-stub

    <Directory /var/www/portal-stub>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    Alias /promotheusfiscaliza /app/public
    <Directory /app/public>
        Options -Indexes -MultiViews
        AllowOverride None
        Require all granted
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [QSA,L]
        # Arquivos estáticos não passam pelo PHP: recebem aqui as mesmas proteções básicas.
        Header always set X-Content-Type-Options "nosniff"
        Header always set Cross-Origin-Resource-Policy "same-origin"
        <FilesMatch "\.(css|js|svg|woff2|png)$">
            Header set Cache-Control "public, max-age=604800"
            Header set Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self' data:; font-src 'self'; frame-ancestors 'none'"
        </FilesMatch>
    </Directory>

    # Somente public/ é servido; o restante de /app (src, .env, vendor, var) não tem rota.
    <Directory /app>
        Require all denied
    </Directory>
    <Directory /app/public>
        Require all granted
    </Directory>

    AddOutputFilterByType DEFLATE text/html text/css application/javascript application/json image/svg+xml
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
