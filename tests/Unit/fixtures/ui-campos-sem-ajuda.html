<div class="field  ">
    <div class="field__head"><label for="f-address_ref">Número ou referência <span class="optional">(opcional)</span></label></div>
  <div class="field__body">
      <input id="f-address_ref" name="address_ref" type="text" value="181"
      maxlength="160"       placeholder="Ex.: 1200"               >
    
  </div>
</div>
<div class="field  has-error">
    <div class="field__head"><label for="f-cep">CEP <span class="req" aria-hidden="true">*</span></label></div>
  <div class="field__body">
      <input id="f-cep" name="cep" type="text" value=""
       inputmode="numeric"       required             aria-invalid="true" aria-describedby="err-cep">
    <span class="error" id="err-cep">CEP inválido.</span>
  </div>
</div>
<div class="field span-2 ">
    <div class="field__head"><label for="f-notes">Observações <span class="optional">(opcional)</span></label></div>
  <div class="field__body">
      <textarea id="f-notes" name="notes" maxlength="500"   ></textarea>
    
  </div>
</div>
<div class="field  ">
  <div class="field__head"><label for="f-role">Função <span class="req" aria-hidden="true">*</span></label></div>
  <div class="field__body">
  <select id="f-role" name="role" required  >
        <option value="A" >Um</option><option value="B" selected>Dois</option>  </select>
  
  </div>
</div>
<div class="field  has-error">
  <div class="field__head"><label for="f-kind">Tipo <span class="optional">(opcional)</span></label></div>
  <div class="field__body">
  <select id="f-kind" name="kind"   aria-invalid="true" aria-describedby="err-kind">
    <option value="">Escolha…</option>    <option value="A" >Um</option>  </select>
  <span class="error" id="err-kind">Obrigatório.</span>
  </div>
</div>
